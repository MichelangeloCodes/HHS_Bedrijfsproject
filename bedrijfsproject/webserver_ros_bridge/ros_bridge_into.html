<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS 2 Integer Listener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        #output {
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>ROS 2 Integer Listener</h1>
    <p id="connection-status">Connecting to ROS 2...</p>
    <div id="output">Waiting for data...</div>

    <!-- Include roslibjs -->
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
    <script>
        // Connect to rosbridge server
        const ros = new ROSLIB.Ros({
            url: 'ws://localhost:9090' // Replace with your rosbridge server address
        });

        // Connection feedback
        ros.on('connection', () => {
            console.log('Connected to rosbridge server.');
            document.getElementById('connection-status').textContent = 'Connected to ROS 2!';
            setupTopic();
        });

        ros.on('error', (error) => {
            console.error('Error connecting to rosbridge:', error);
            document.getElementById('connection-status').textContent = 'Error connecting to ROS 2.';
        });

        ros.on('close', () => {
            console.log('Connection to rosbridge closed.');
            document.getElementById('connection-status').textContent = 'Connection closed.';
        });

        // Subscribe to the integer topic
        function setupTopic() {
            const intTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/int_topic',
                messageType: 'std_msgs/Int32' // Standard message type for integers
            });

            intTopic.subscribe((message) => {
                console.log('Received message:', message);
                document.getElementById('output').textContent = `Received Integer: ${message.data}`;
            });
        }
    </script>
</body>
</html>
