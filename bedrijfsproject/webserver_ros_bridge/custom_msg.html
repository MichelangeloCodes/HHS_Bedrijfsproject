<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS 2 Listener</title>
</head>
<body>
    <h1>Listening to ROS 2 Topics</h1>

    <!-- Include roslibjs from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>

    <script>
        // Connect to rosbridge server
        const ros = new ROSLIB.Ros({
            url: 'ws://localhost:9090'  // Change if needed
        });

        ros.on('connection', () => {
            console.log('Connected to rosbridge server.');
            setupTopics();
        });

        ros.on('error', (error) => {
            console.error('Error connecting to rosbridge:', error);
        });

        ros.on('close', () => {
            console.log('Connection to rosbridge closed.');
        });

        // Subscribe to the float data topic
        function setupTopics() {
            const floatTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/sensor_publisher',  // The topic name for the float
                messageType: 'std_msgs/msg/Float64'  // The message type for the float
            });

            const stringTopic = new ROSLIB.Topic({
                ros: ros,
                name: '/sensor_publisher',  // The topic name for the string
                messageType: 'std_msgs/msg/String'  // The message type for the string
            });

            // Subscribe to the float topic
            floatTopic.subscribe(function (message) {
                console.log('Received Float:', message.data);  // Log the float value
            });

            // Subscribe to the string topic
            stringTopic.subscribe(function (message) {
                console.log('Received String:', message.data);  // Log the string value
            });
        }
    </script>
</body>
</html>
